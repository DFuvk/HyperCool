name: Refresh README badges

# The badges in README.md are local SVGs so they can keep the for-the-badge
# look with rounded corners (shields.io has no radius option). They are
# regenerated from shields.io daily, on every release, and on demand, which
# keeps the values current.
on:
  schedule:
    - cron: "23 4 * * *"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  badges:
    name: Regenerate docs/badges
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Regenerate badges
        run: python3 tools/make-badges.py

      - name: Commit changes
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/badges; then
            echo "Badges are current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/badges
          git commit -m "docs: refresh README badges [skip ci]"
          git pull --rebase --autostash origin master
          git push origin master

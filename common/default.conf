# HyperCool configuration
# 1 = ON, 0 = OFF. Numeric values can be typed manually (0 = off / don't change).
# Sub-values set to 0 = keep the stock value.
# Every change is applied ONCE at the next boot. Nothing runs in the background except the opt-in keepers (charge limit, screen-off profile, daily cache clean).
cfg_ver=3

# ---------- Heat control (kernel) ----------
# cpu_cap = % of max clock for big/prime clusters (40-99, 0 = off)
cpu_cap=95
# cpu_cap_lock: make scaling_max_freq read-only after the cap so ROM boosters cannot raise it (1 = on)
cpu_cap_lock=1
# cpu_cap_little = % of max clock for the little cluster (50-99, 0 = off)
cpu_cap_little=0
# cpu_cap_little_lock: make the little cluster scaling_max_freq read-only after the cap (1 = on)
cpu_cap_little_lock=1
prime_park=0
# gpu_cap = GPU max frequency in MHz from your GPU table (1-4 = steps below the top; 0 = off)
gpu_cap=0
# gpu_cap_lock: make the GPU limit read-only so ROM services cannot raise it (1 = on)
gpu_cap_lock=1
gpu_idle=1
gpu_idle_timer=64
# gpu_throttle: Adreno GPU thermal throttling 1 on (recommended), 0 off
gpu_throttle=1
walt_tune=1
walt_hispeed_load=95
walt_up_rate=1000
walt_sched_boost_off=1
# walt_task_util: WALT sched_min_task_util_for_boost 80 / _for_colocation 65 (only raised, Qualcomm)
walt_task_util=1
input_boost_off=0
bg_cpuset=1
bg_uclamp=30
# bg_daemons: logging / diagnostic daemons and light HALs into the background groups
bg_daemons=1
blur_off=0
# charge_cool = charge current limit in mA (500-12000, 0 = off)
charge_cool=0
# charge_cool_level: exact charger level 1-15 (0 = pick from the mA value above)
charge_cool_level=0
# charge_limit: Xiaomi night_charging flag, stops charging near 80%
charge_limit=0

# ---------- Screen-off power profile (keeper) ----------
# soff_prof: while the screen is off cap big cores to soff_cpu % (30-90), GPU to its lowest clock
# (soff_gpu) and turn scheduler boosts off (soff_boost); restored when the screen turns on
soff_prof=0
soff_cpu=60
soff_gpu=1
soff_boost=1
# wifi_keep: while the screen is off, turn Wi-Fi on again if the ROM switched it off (Wi-Fi you switched off
# yourself before the screen went off stays off). Runs inside the screen-off keeper
wifi_keep=0
# soff_radio: after the screen has been off for soff_radio_min minutes (5-120) switch Location off (and Bluetooth
# when soff_radio_bt=1, skipped while audio plays or an audio device is connected); both come back when the screen turns on
soff_radio=0
soff_radio_min=15
soff_radio_bt=0
# f2fs_gc: F2FS garbage collection through gc_urgent (the switch Android idle maintenance uses). Runs for up to 7 min,
# only while the screen has been off 10 min (charger not needed, 30% battery when not charging) and the battery is under f2fs_gc_temp-5 C, at most once a week,
# and only when the space that only GC can free (f2fs "unusable") is at least f2fs_gc_gb GB (1-15).
# f2fs_gc_trim=1: also fstrim /data after a GC run, at most once a week
f2fs_gc=0
f2fs_gc_gb=4
f2fs_gc_trim=1
# f2fs_gc_temp: a run is stopped when the battery reaches this temperature (41-50 C, default 45)
f2fs_gc_temp=45
# f2fs_gc_notify: 1 = notification with the result after each GC run (also when it was stopped)
f2fs_gc_notify=1
# x_dexopt_auto: optimize all apps (dex2oat speed-profile, 1 at a time, NO force recompile) once a week while the screen has been off
# 10 min (runs in the screen-off keeper, common/dxauto.sh). Battery under 40 C to start, stops at 45 C, under 15% battery or when the
# screen turns on; charger not needed, but without one the battery must be at least 40%.
x_dexopt_auto=0
# x_dexopt_mode: 1 speed-profile (default), 2 speed, 3 everything (never a force recompile)
x_dexopt_mode=1
# x_dexopt_notify: 1 = notification with the result after each automatic run (also when it was stopped)
x_dexopt_notify=1

# ---------- Battery drain (kernel) ----------
cpu_idle=1
ufs_pm=1
vm_tune=1
vm_writeback=3000
vm_stat_interval=10
vm_dirty_bg=10
vm_dirty=30
io_tune=1
debug_off=1
debug_props=1
wakelock_block=0
# only scan-related wakelocks: nothing on the notification / push path
wl_list=wlan_pno_wl;wlan_extscan_wl;wcnss_filter_lock

# ---------- Protected apps (never restricted, kept alive in Doze) ----------
protect_apps=1
protect_pkgs=com.whatsapp,com.whatsapp.w4b,org.telegram.messenger,org.telegram.plus,com.facebook.orca,jp.naver.line.android,com.discord,com.google.android.gm
# app_bucket: 0 off, 1 rare, 2 restricted (non-protected user apps)
app_bucket=0
# bg_block: picked apps get no background execution (empty list = nothing happens)
bg_block=1
bg_block_pkgs=
# app_disable: disable the picked apps (system apps allowed; critical ones are always skipped). Off = all enabled again
app_disable=0
app_disable_pkgs=

# ---------- Battery drain (system / ROM) ----------
app_freezer=1
# doze_aggr: 0 off, 1 moderate, 2 aggressive, 3 maximum, 4 custom (doze_custom)
doze_aggr=2
doze_custom=light_after_inactive_to=15000,light_pre_idle_to=30000,light_idle_to=900000,light_max_idle_to=1800000,inactive_to=60000,sensing_to=0,locating_to=0,motion_inactive_to=0,idle_after_inactive_to=0,idle_pending_to=60000,quick_doze_delay_to=15000,idle_to=3600000,max_idle_to=21600000
devcfg_lock=0
gms_doze=0
scan_off=1
# loc_throttle: background location updates at most every 0 = Android default (30 min), 1 = 1 h, 2 = 2 h, 3 = 4 h
loc_throttle=0
net_save=1
standby=1
stats_reduce=1
tracking_off=1
debloat=1
joyose_off=0
log_reduce=1

# ---------- Long battery / saver ----------
# saver_policy: 0 off, 1 balanced, 2 extreme, 3 custom (saver_constants)
saver_policy=1
# saver_vib: 1 = also turn vibration and haptics off while Battery Saver is on
saver_vib=0
saver_constants=advertise_is_enabled=true,enable_datasaver=false,disable_launch_boost=true,disable_vibration=false,disable_animation=false,soundtrigger_mode=1,defer_full_backup=true,defer_keyvalue_backup=true,enable_firewall=true,location_mode=3,enable_brightness_adjustment=false,force_all_apps_standby=true,force_background_check=true,disable_optional_sensors=true,disable_aod=true,enable_quick_doze=true,enable_night_mode=true
# saver_trigger: auto Battery Saver % (5-95, 0 = don't change)
saver_trigger=0
# saver_dim: screen brightness while Battery Saver is on: 0 off, 1 90%, 2 80%, 3 70%, 4 60%
saver_dim=0
# smart_px: ROM Smart Pixels (crDroid/RR...): 0 off, 1 while Battery Saver is on, 2 always
smart_px=0
# refresh_rate: peak Hz (30-165, 0 = don't change)
refresh_rate=0
# rr_adapt: adaptive refresh rate, rr_active Hz on touch / button press, rr_idle Hz when idle
rr_adapt=0
rr_active=120
rr_idle=60
# anim_scale: % of normal speed (10-100, 0 = don't change)
anim_scale=0

# ---------- Advanced ----------
# apply_delay: seconds after boot (10-120)
apply_delay=30
# boot_notify: 1 = notification when the one-shot apply at boot is done
boot_notify=1

# ---------- More (merged extras; safe ones ON by default, see each key) ----------
# Extra kernel tuning
x_sched=0
x_kquiet=1
x_net=1
x_io=0
x_xiaomi_fw=1
# RAM management - x_ram_level: 1 moderate, 2 maximum
# x_multitask: 0 off, 1 balanced, 2 performance, 3 powersaving
x_ram_opt=0
x_ram_level=1
x_multitask=0
# x_compact: compact background apps while the screen is off, only when free RAM is low (runs in the screen-off keeper, common/compact.sh)
x_compact=0
# x_zram: zram0 size x_zram_size GB (2-8), algorithm x_zram_alg (lz4, zstd, lzo-rle ... or keep),
# swap priority follows the kernel default (usually -1; the live value is shown in the status)
x_zram=0
x_zram_size=4
x_zram_alg=lz4
# x_zram_size=0 uses x_zram_custom (1-12 GB)
x_zram_custom=4
# Google services & telemetry
x_gms_freeze=0
x_track=1
# Logging & diagnostics
x_log_nuke=0
x_diag=1
x_props=1
# Extra power saving (kernel, applied at boot; stock again after reboot when off)
x_kpower=1
x_vm_lite=0
# x_eas: keep the Energy Aware Scheduler on (kernel.sched_energy_aware = 1)
x_eas=1
# x_job_limit: 0 off, 1 balanced, 2 strong (JobScheduler runs background jobs in bigger, later batches)
x_job_limit=0
# x_rpm: runtime power management "auto" for idle USB / I2C / SPI devices (touch, audio, charger chips skipped)
x_rpm=0
# x_balanced: balanced system defaults (undo boost floors / forced bus and DRAM clocks, MediaTek protections on)
x_balanced=1
# x_bal_bus: also unlock the other Qualcomm CPU/LLCC/DDR bandwidth devfreq voters (cpu-lat, cpu-bw, llccbw, cpubw, kgsl-ddr-qos)
x_bal_bus=0
# x_kcommon: common kernel, memory, storage and network tuning
x_kcommon=1
# Storage: app-cache clean every x_cache_days days (keeper); x_cache_min = optional minimum MB (0 = always clean)
x_cache_auto=1
x_cache_min=0
# x_cache_days: days between two auto cleans (1-7)
x_cache_days=1
# x_cache_keep: 1 = apps in x_cache_keep_pkgs keep their cache (comma separated packages)
x_cache_keep=1
x_cache_keep_pkgs=
# x_cache_notify: 1 = notification after each app cache clean (daily auto clean and Clean now)
x_cache_notify=1
